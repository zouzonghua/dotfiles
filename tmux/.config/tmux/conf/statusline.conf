# Interval for updating the status line
set-option -g status-interval 5

# Specify the maximum length of status-left
set-option -g status-left-length 40

# Specify the maximum length of status-right
set-option -g status-right-length 60

# macOS Terminal.app — Basic / 深色外观
set-option -g status-bg "#1e1e1e"
set-option -g status-fg "#ffffff"
set-option -g status-style "bg=#1e1e1e,fg=#ffffff"
set-option -g pane-border-style "fg=#909090"
set-option -g pane-active-border-style "fg=#d09af9"
set-option -g display-panes-colour "#6a43f6"
set-option -g display-panes-active-colour "#fd502f"
set-option -g message-style "bg=#b8b739,fg=#000000"
set-option -g message-command-style "bg=#000000,fg=#efef53"
set-window-option -g mode-style "bg=#b8b739,fg=#000000"

set-option -g status-left "#[fg=#ffffff,bg=#{?pane_synchronized,#fd502f,#1e1e1e}]#{?client_prefix,#[reverse],}#{?window_zoomed_flag, z, ^} #[default]"
set-option -g status-right '#[fg=#ffffff,bg=#1e1e1e] #(~/.config/tmux/bin/cpu-load.sh "#54c63a" "#b8b739" "#fd502f") #[default]'

set-window-option -g window-status-format "#[fg=#ffffff,bg=#1e1e1e] #I #[default]"
set-window-option -g window-status-current-format "#[fg=#ffffff,bg=#3f638b,bold] #I #[default]"

set-window-option -g window-status-activity-style "fg=#77ea51"
set-window-option -g monitor-bell off
set-option -g bell-action none
