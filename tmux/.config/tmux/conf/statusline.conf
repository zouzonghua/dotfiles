# Disable periodic status updates
set-option -g status-interval 0

# VSCode Dark / kitty current-theme.conf
set-option -g status-style "bg=#1e1e1e,fg=#cccccc"

# Keep pane borders neutral; distinguish focus by dimming inactive panes
set-option -g pane-border-indicators off
set-option -g pane-border-style "fg=#414140"
set-option -g pane-active-border-style "fg=#e7e7e7"
set-window-option -g window-style "fg=#666666,bg=terminal"
set-window-option -g window-active-style "fg=terminal,bg=terminal"

set-option -g display-panes-colour "#3b8eea"
set-option -g display-panes-active-colour "#f14c4c"
set-option -g message-style "bg=#f5f543,fg=#1e1e1e"
set-option -g message-command-style "bg=#414140,fg=#e5e510"
set-window-option -g mode-style "bg=#f5f543,fg=#1e1e1e"

set-option -g status-left "#[fg=#{?#{==:#{client_key_table},prefix},#1e1e1e,#cccccc},bg=#{?#{==:#{client_key_table},prefix},#cccccc,#{?pane_synchronized,#f14c4c,#1e1e1e}}]#{?window_zoomed_flag, z, ^} #[default]"
set-option -g status-right ""

set-window-option -g window-status-format "#[fg=#858485,bg=#1e1e1e] #I #[default]"
set-window-option -g window-status-current-format "#[fg=#ffffff,bg=#3a3d41,bold] #I #[default]"

set-window-option -g monitor-bell off
set-option -g bell-action none
