# Disable periodic status updates
set-option -g status-interval 0

# Gruvbox Dark Hard
set-option -g status-style "bg=#1d2021,fg=#ebdbb2"

# Keep pane borders neutral; distinguish focus by dimming inactive panes
set-option -g pane-border-indicators off
set-option -g pane-border-style "fg=#3c3836"
set-option -g pane-active-border-style "fg=#3c3836"
set-window-option -g window-style "fg=#928374,bg=terminal"
set-window-option -g window-active-style "fg=terminal,bg=terminal"

set-option -g display-panes-colour "#458588"
set-option -g display-panes-active-colour "#fb4934"
set-option -g message-style "bg=#d79921,fg=#1d2021"
set-option -g message-command-style "bg=#3c3836,fg=#fabd2f"
set-window-option -g mode-style "bg=#d79921,fg=#1d2021"

set-option -g status-left "#[fg=#{?#{==:#{client_key_table},prefix},#1d2021,#ebdbb2},bg=#{?#{==:#{client_key_table},prefix},#ebdbb2,#{?pane_synchronized,#fb4934,#1d2021}}]#{?window_zoomed_flag, z, ^} #[default]"
set-option -g status-right ""

set-window-option -g window-status-format "#[fg=#a89984,bg=#1d2021] #I #[default]"
set-window-option -g window-status-current-format "#[fg=#fbf1c7,bg=#458588,bold] #I #[default]"

set-window-option -g monitor-bell off
set-option -g bell-action none
