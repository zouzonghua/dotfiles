# Clipboard synchronization
# Use OSC 52 for both local Linux terminals and SSH clients. This avoids
# coupling the clipboard strategy to the tmux server's startup environment.
set-option -as terminal-features ",*:clipboard"
set-option -gu terminal-overrides
set-option -g terminal-overrides[0] '*:Ms=\E]52;%p1%s;%p2%s\007'
set-option -s set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel \; display-message "copied"
bind -T copy-mode-vi y send -X copy-selection-and-cancel \; display-message "copied"
bind -T copy-mode-vi v send-keys -X begin-selection
