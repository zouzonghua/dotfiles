# Terminal events and input
set-option -g focus-events on
set-option -sg escape-time 10

# Clean up terminal modes left behind by a disconnected SSH session
bind C-r run-shell "printf '\\033[?25h\\033[?1000l\\033[?1002l\\033[?1003l\\033[?1006l\\033[?1015l\\033[?2004l' > '#{pane_tty}'" \; display-message "terminal reset"

# Terminal capabilities
set-option -g default-terminal "tmux-256color"
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

# Restore defaults before appending to keep reloads idempotent
set-option -gu terminal-features
set-option -as terminal-features ",xterm-256color:RGB"
set-option -as terminal-features ",tmux-256color:clipboard"
set-option -gu terminal-overrides
